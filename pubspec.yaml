name: posyandu_merpati
description: "Aplikasi Manajemen Posyandu Merpati - Monitoring Kesehatan Balita"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.4

  # State Management
  provider: ^6.1.5

  # Local Storage
  shared_preferences: ^2.3.5

  # Firebase
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Charts
  fl_chart: ^0.70.2

  # Calendar
  table_calendar: ^3.1.2

  # Reports
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6

  # Utilities
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  open_file: ^3.5.5
  share_plus: ^10.1.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
